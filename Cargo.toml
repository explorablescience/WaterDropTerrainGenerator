[package]
name = "waterdrop-terrain-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
egui-snarl = "0.9"
egui_tiles = { version = "0.14", default-features = false }
egui_extras = { version = "0.33", default-features = false, features = ["image"] }
inventory = "0.3"
rayon = "1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.bevy]
version = "0.18"
default-features = false
features = ["multi_threaded", "bevy_winit", "x11", "wayland"]

[dependencies.wde]
path = "../WaterDropEngine/crates/core/wde"
default-features = false
features = ["pbr", "gizmos", "editor"]

[build-dependencies]
anyhow = "1.0.104"
fs_extra = "1.3.0"

[features]
default = []
log-debug = ["wde/log-debug"]
debug = ["wde/debug"]
watch = ["wde/watch"]
tracing = ["wde/tracing"]
gpu-debug = ["wde/gpu-debug"]

[patch.crates-io]
# Fixes an layout bug where output-pin labels drift right on every row of a multi-output node instead of lining up in a column.
# See vendor/README.md.
egui-snarl = { path = "vendor/egui-snarl-0.9.0" }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false
